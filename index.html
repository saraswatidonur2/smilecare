<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmileCare Booking</title>
  <style>
    :root{--brand:#0d9488}
    body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:0 10px}
    body.embed{margin:8px auto}
    .head{display:flex;justify-content:space-between;align-items:center;gap:6px}
    .head h3{margin:8px 0}
    #counter{font-size:13px;color:var(--brand);margin-left:6px}
    #chat{border:1px solid #ccc;border-radius:8px;padding:10px;height:340px;overflow:auto}
    #chat p{margin:6px 0}
    .me{text-align:right;color:var(--brand)}.bot{color:#222}
    button{margin:4px 4px 0 0;padding:8px;border:1px solid var(--brand);background:#fff;border-radius:6px;cursor:pointer}
    input{padding:8px;width:58%}
    select{padding:5px}
    .pay{border:1px solid var(--brand);border-radius:8px;padding:10px;margin:8px 0;background:#f0fdfa}
    .timer{font-size:13px;color:#b45309;margin:4px 0}
    .ok{border:1px solid #16a34a;border-radius:8px;padding:12px;margin:8px 0;background:#f0fdf4}
    .ok h4{margin:0 0 8px;color:#15803d}
    .ok div{margin:3px 0;font-size:14px}
    .ok .note{color:#555;font-size:12px;margin-top:6px}
    .ok img{display:block;margin:8px 0}
  </style>
</head>
<body>
  <div class="head">
    <h3 id="title">SmileCare Booking</h3>
    <div>
      <select id="lang" aria-label="Language">
        <option value="en">English</option><option value="hi">हिंदी</option><option value="kn">ಕನ್ನಡ</option>
      </select>
      <span id="counter"><span id="usedLbl"></span>: <b id="used">0</b>/5</span>
    </div>
  </div>
  <div id="chat"></div>
  <input id="msg">
  <button id="mic" title="Speak" aria-label="Speak">&#127908;</button>
  <button id="sendBtn" onclick="send()"></button>

<script>
// ---------- translations (Hindi and Kannada: have a native speaker check them) ----------
const UI = {
  en: {used:"Messages used", ph:"e.g. cleaning with Dr. Rao on Saturday morning", send:"Send",
       mobile:"Enter your mobile number", mobile_ph:"10-digit mobile", otp:"Enter the 6-digit OTP", otp_ph:"OTP",
       name:"Your name", name_ph:"Full name", pay:"Pay \u20b9{0}", held:"Your slot is held for you: ",
       hold_gone:"Your 5-minute slot hold has expired. Please start again.",
       l_name:"Name", l_mobile:"Mobile", l_service:"Service", l_doctor:"Doctor", l_date:"Date", l_time:"Time", l_paid:"Paid", l_id:"Booking ID",
       cal:"Add to calendar", cancel:"Cancel appointment", cancel_q:"Cancel this appointment?", resched:"Reschedule", qr:"Show this QR code at the clinic reception",
       remind:"Reminders: 24 hours and 2 hours before (WhatsApp/SMS in the live version)"},
  hi: {used:"उपयोग किए गए संदेश", ph:"जैसे: शनिवार सुबह डॉ. राव के साथ सफाई", send:"भेजें",
       mobile:"अपना मोबाइल नंबर दर्ज करें", mobile_ph:"10 अंकों का मोबाइल", otp:"6 अंकों का OTP दर्ज करें", otp_ph:"OTP",
       name:"आपका नाम", name_ph:"पूरा नाम", pay:"\u20b9{0} का भुगतान करें", held:"आपका स्लॉट आपके लिए रोका गया है: ",
       hold_gone:"आपका 5 मिनट का स्लॉट होल्ड समाप्त हो गया। कृपया फिर से शुरू करें।",
       l_name:"नाम", l_mobile:"मोबाइल", l_service:"सेवा", l_doctor:"डॉक्टर", l_date:"तारीख", l_time:"समय", l_paid:"भुगतान", l_id:"बुकिंग आईडी",
       cal:"कैलेंडर में जोड़ें", cancel:"अपॉइंटमेंट रद्द करें", cancel_q:"क्या यह अपॉइंटमेंट रद्द करें?", resched:"समय बदलें", qr:"क्लिनिक रिसेप्शन पर यह QR कोड दिखाएँ",
       remind:"रिमाइंडर: 24 घंटे और 2 घंटे पहले (लाइव संस्करण में WhatsApp/SMS)"},
  kn: {used:"ಬಳಸಿದ ಸಂದೇಶಗಳು", ph:"ಉದಾ: ಶನಿವಾರ ಬೆಳಿಗ್ಗೆ ಡಾ. ರಾವ್ ಅವರೊಂದಿಗೆ ಕ್ಲೀನಿಂಗ್", send:"ಕಳುಹಿಸಿ",
       mobile:"ನಿಮ್ಮ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ", mobile_ph:"10 ಅಂಕಿಯ ಮೊಬೈಲ್", otp:"6 ಅಂಕಿಯ OTP ನಮೂದಿಸಿ", otp_ph:"OTP",
       name:"ನಿಮ್ಮ ಹೆಸರು", name_ph:"ಪೂರ್ಣ ಹೆಸರು", pay:"\u20b9{0} ಪಾವತಿಸಿ", held:"ನಿಮ್ಮ ಸ್ಲಾಟ್ ನಿಮಗಾಗಿ ಕಾಯ್ದಿರಿಸಲಾಗಿದೆ: ",
       hold_gone:"ನಿಮ್ಮ 5 ನಿಮಿಷಗಳ ಸ್ಲಾಟ್ ಕಾಯ್ದಿರಿಕೆ ಮುಗಿದಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಾರಂಭಿಸಿ.",
       l_name:"ಹೆಸರು", l_mobile:"ಮೊಬೈಲ್", l_service:"ಸೇವೆ", l_doctor:"ವೈದ್ಯರು", l_date:"ದಿನಾಂಕ", l_time:"ಸಮಯ", l_paid:"ಪಾವತಿ", l_id:"ಬುಕಿಂಗ್ ಐಡಿ",
       cal:"ಕ್ಯಾಲೆಂಡರ್‌ಗೆ ಸೇರಿಸಿ", cancel:"ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ರದ್ದುಮಾಡಿ", cancel_q:"ಈ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ರದ್ದುಮಾಡಬೇಕೇ?", resched:"ಸಮಯ ಬದಲಿಸಿ", qr:"ಕ್ಲಿನಿಕ್ ರಿಸೆಪ್ಷನ್‌ನಲ್ಲಿ ಈ QR ಕೋಡ್ ತೋರಿಸಿ",
       remind:"ಜ್ಞಾಪನೆಗಳು: 24 ಗಂಟೆ ಮತ್ತು 2 ಗಂಟೆ ಮೊದಲು (ಲೈವ್ ಆವೃತ್ತಿಯಲ್ಲಿ WhatsApp/SMS)"}
};
const DOC = {"Dr. Rao": {hi:"डॉ. राव", kn:"ಡಾ. ರಾವ್"}, "Dr. Meena": {hi:"डॉ. मीना", kn:"ಡಾ. ಮೀನಾ"}};
const DAYS = {hi: {Mon:"सोमवार",Tue:"मंगलवार",Wed:"बुधवार",Thu:"गुरुवार",Fri:"शुक्रवार",Sat:"शनिवार",Sun:"रविवार"},
              kn: {Mon:"ಸೋಮವಾರ",Tue:"ಮಂಗಳವಾರ",Wed:"ಬುಧವಾರ",Thu:"ಗುರುವಾರ",Fri:"ಶುಕ್ರವಾರ",Sat:"ಶನಿವಾರ",Sun:"ಭಾನುವಾರ"}};
let lang = "en";
const DAY_KEYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const FULL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const VOICE = {en:"en-IN", hi:"hi-IN", kn:"kn-IN", bn:"bn-IN", te:"te-IN", mr:"mr-IN", ta:"ta-IN", ur:"ur-IN", gu:"gu-IN",
               ml:"ml-IN", pa:"pa-IN", or:"or-IN", ne:"ne-NP", as:"as-IN"};

// Languages other than English/Hindi/Kannada: the server translates the screen text once, then it is reused
async function ensureLang(code) {
  if (UI[code]) return;
  const keys = Object.keys(UI.en);
  const texts = keys.map(k => UI.en[k]).concat(FULL_DAYS);
  try {
    const res = await fetch("/api/translate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({lang: code, texts})});
    const data = await res.json();
    if (data.ok) {
      UI[code] = {}; keys.forEach((k, i) => { UI[code][k] = data.texts[i]; });
      DAYS[code] = {}; DAY_KEYS.forEach((d, i) => { DAYS[code][d] = data.texts[keys.length + i]; });
      return;
    }
  } catch (e) {}
  UI[code] = {...UI.en};   // translation service unavailable: stay readable in English
}
const t = (k, ...a) => { let s = (UI[lang] && UI[lang][k]) || UI.en[k]; a.forEach((v, i) => { s = s.replace("{" + i + "}", v); }); return s; };
const docName = d => (DOC[d] && DOC[d][lang]) || d;
const dayName = d => (DAYS[lang] && DAYS[lang][d]) || d;

// ---------- widget options from the URL: ?embed=1&color=%230d9488&clinic=SmileCare ----------
const params = new URLSearchParams(location.search);
if (params.get("embed")) document.body.classList.add("embed");
if (params.get("color")) document.documentElement.style.setProperty("--brand", params.get("color"));
if (params.get("clinic")) document.getElementById("title").textContent = params.get("clinic") + " Booking";

const chat = document.getElementById("chat");
let used = 0;
let journeyDone = false;   // after a finished booking, the next request starts a fresh count

function applyLang() {
  document.getElementById("msg").placeholder = t("ph");
  document.getElementById("sendBtn").textContent = t("send");
  document.getElementById("usedLbl").textContent = t("used");
  document.getElementById("lang").value = lang;
}
document.getElementById("lang").onchange = async e => { const code = e.target.value; await ensureLang(code); lang = code; applyLang(); };
fetch("/api/languages").then(r => r.json()).then(d => {      // the dropdown lists every language the server can use
  const sel = document.getElementById("lang"); sel.innerHTML = "";
  d.languages.forEach(l => { const o = document.createElement("option"); o.value = l.code; o.textContent = l.name; sel.appendChild(o); });
  sel.value = lang;
}).catch(() => {});

const scroll = () => { chat.scrollTop = chat.scrollHeight; };
function add(text, cls) {
  const p = document.createElement("p"); p.className = cls; p.textContent = text;   // textContent = safe from injected HTML
  chat.appendChild(p); scroll();
  return p;
}
const count = () => { used++; document.getElementById("used").textContent = used; };
const resetCount = () => { used = 0; document.getElementById("used").textContent = 0; };

async function post(url, body) {
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, lang})});
  return res.json();
}

// Shows an input inside the chat and waits for the patient's answer. Retries don't use up the message budget.
function ask(label, placeholder, counts = true) {
  return new Promise(resolve => {
    add(label, "bot");
    const wrap = document.createElement("div");
    const inp = document.createElement("input"); inp.placeholder = placeholder;
    const btn = document.createElement("button"); btn.textContent = t("send");
    btn.onclick = () => {
      const v = inp.value.trim(); if (!v) return;
      wrap.remove(); add(v, "me"); if (counts) count(); resolve(v);
    };
    wrap.append(inp, btn); chat.appendChild(wrap); inp.focus(); scroll();
  });
}

async function send() {
  const box = document.getElementById("msg");
  const message = box.value.trim(); if (!message) return;
  if (journeyDone) { resetCount(); journeyDone = false; }
  add(message, "me"); count(); box.value = "";
  const data = await post("/chat", {message});
  if (data.lang && data.lang !== lang) { await ensureLang(data.lang); lang = data.lang; applyLang(); }   // follows the language the patient writes in
  add(data.reply, "bot");
  if (data.ui && data.ui.type === "slots") showSlots(data.ui.slots, data.ui.service);
}

function showSlots(slots, service) {
  const wrap = document.createElement("div");
  slots.forEach(s => {
    const b = document.createElement("button");
    b.textContent = `${docName(s.doctor)} \u00b7 ${dayName(s.date)} ${s.time}`;
    b.onclick = () => { wrap.remove(); book(s.id, service); };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap); scroll();
}

// Smart slot recovery: when a hold ends without payment, offer the nearest alternatives
async function recover(slot_id, service) {
  const r = await post("/recover", {slot_id, service});
  add(r.reply, "bot");
  if (r.ok) showSlots(r.slots, service);
}

// Booking flow: mobile -> OTP -> name -> pay -> confirmed
async function book(slot_id, service) {
  const mobile = await ask(t("mobile"), t("mobile_ph"));
  const o = await post("/send-otp", {slot_id, mobile});
  add(o.reply, "bot");
  if (!o.ok) { journeyDone = true; return; }

  let verified = false;
  for (let i = 0; i < 3 && !verified; i++) {
    const otp = await ask(t("otp"), t("otp_ph"), i === 0);
    const v = await post("/verify-otp", {mobile, otp});
    add(v.reply, "bot");
    verified = v.ok;
    if (!v.ok && v.restart) { journeyDone = true; return; }
  }
  if (!verified) { journeyDone = true; return; }

  const name = await ask(t("name"), t("name_ph"));
  const c = await post("/create-order", {slot_id, name, mobile, service});
  add(c.reply, "bot");
  if (!c.ok) { journeyDone = true; if (c.expired) recover(slot_id, service); return; }
  showPayment(c);
}

// Simulated checkout card (real version: Razorpay checkout opens here). Shows a live 5-minute hold timer.
function showPayment(c) {
  const card = document.createElement("div"); card.className = "pay";
  const title = document.createElement("div"); title.style.fontWeight = "600";
  title.textContent = `\u20b9${c.amount} (test mode, order ${c.order_id})`;
  const timer = document.createElement("div"); timer.className = "timer";
  const pay = document.createElement("button"); pay.textContent = t("pay", c.amount);
  const fail = document.createElement("button"); fail.textContent = "Demo only: simulate failed payment";

  let left = c.hold_left;
  const show = () => { timer.textContent = t("held") + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); };
  show();
  const tick = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(tick); card.remove();
      add(t("hold_gone"), "bot");
      journeyDone = true; recover(c.slot_id, c.service); return;
    }
    show();
  }, 1000);

  pay.onclick = () => { clearInterval(tick); doPay(c, card, true); };
  fail.onclick = () => { clearInterval(tick); doPay(c, card, false); };
  // failure button is shown only when the page is opened with ?demo
  card.append(title, timer, pay); if (location.search.includes("demo")) card.append(fail);
  chat.appendChild(card); scroll();
}

let failNote = null;   // the "payment unsuccessful" line; removed as soon as the patient retries or pays

async function doPay(c, card, success) {
  card.remove();
  const r = await post("/pay-demo", {order_id: c.order_id, success});
  if (failNote) { failNote.remove(); failNote = null; }
  if (r.ok) {
    journeyDone = true;
    showConfirmation(r);
  } else if (r.retry) {
    failNote = add(r.reply, "bot");   // slot stays held; the patient can pay again
    showPayment({...c, hold_left: r.hold_left});
  } else {
    add(r.reply, "bot");
    journeyDone = true;
    if (r.expired) recover(c.slot_id, c.service);
  }
}

// Clean success card with the patient's own booking details, calendar link and cancel option
function showConfirmation(r) {
  const d = r.details, card = document.createElement("div"); card.className = "ok";
  const title = document.createElement("h4"); title.textContent = r.reply; card.appendChild(title);
  [[t("l_name"), d.name], [t("l_mobile"), d.mobile], [t("l_service"), d.service], [t("l_doctor"), d.doctor],
   [t("l_date"), d.date], [t("l_time"), d.time], [t("l_paid"), "\u20b9" + d.amount], [t("l_id"), d.receipt]].forEach(([k, v]) => {
    const row = document.createElement("div"); row.textContent = k + ": " + v; card.appendChild(row);
  });
  const remind = document.createElement("div"); remind.className = "note"; remind.textContent = t("remind"); card.appendChild(remind);
  const link = document.createElement("a");
  link.href = `/calendar/${d.receipt}`; link.textContent = t("cal");
  const cancel = document.createElement("button"); cancel.textContent = t("cancel");
  cancel.onclick = async () => {
    if (!confirm(t("cancel_q"))) return;
    const res = await post("/cancel", {order_id: d.receipt, mobile: d.mobile});
    add(res.reply, "bot");
    if (res.ok) { cancel.remove(); link.remove(); card.style.opacity = "0.6"; }
  };
  const qr = document.createElement("img");                       // QR check-in pass for the reception desk
  qr.src = `/qr/${d.receipt}.svg?base=${encodeURIComponent(location.origin)}`;
  qr.alt = "QR"; qr.width = 120; qr.height = 120; qr.onerror = () => { qr.remove(); qrNote.remove(); };
  const qrNote = document.createElement("div"); qrNote.className = "note"; qrNote.textContent = t("qr");
  const resched = document.createElement("button"); resched.textContent = t("resched");
  resched.onclick = async () => {
    const o = await post("/reschedule-options", {order_id: d.receipt, mobile: d.mobile});
    add(o.reply, "bot");
    if (!o.ok) return;
    const wrap = document.createElement("div");
    o.slots.forEach(s => {
      const b = document.createElement("button");
      b.textContent = `${docName(s.doctor)} \u00b7 ${dayName(s.date)} ${s.time}`;
      b.onclick = async () => {
        wrap.remove();
        const x = await post("/reschedule", {order_id: d.receipt, mobile: d.mobile, slot_id: s.id});
        add(x.reply, "bot");
        if (x.ok) { card.remove(); showConfirmation(x); }
      };
      wrap.appendChild(b);
    });
    chat.appendChild(wrap); scroll();
  };
  card.append(qr, qrNote, link, document.createElement("br"), resched, cancel);
  chat.appendChild(card); scroll();
}

// ---------- voice booking (Chrome: speech recognition) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById("mic");
if (!SR) { mic.style.display = "none"; } else {
  mic.onclick = () => {
    const rec = new SR(); rec.lang = VOICE[lang] || "en-IN";
    mic.textContent = "...";
    rec.onresult = e => { document.getElementById("msg").value = e.results[0][0].transcript; send(); };
    rec.onend = rec.onerror = () => { mic.innerHTML = "&#127908;"; };
    rec.start();
  };
}
document.getElementById("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
applyLang();
</script>
</body>
</html>
