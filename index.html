<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediGuide AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E6B78">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--leaf:#E4F2DD;--bg:#F6FAFA;--card:#fff;--ink:#12303A;--mut:#5B7680;--line:#DCE9EA;--pri:#0E6B78;--pri2:#0A525C;--mint:#DDF3EC;--sky:#E6F1FA;--sand:#FFF1DE;--red:#C93B3B;--redbg:#FDECEC;--ok:#1E8E5A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--leaf:#1D3A24;--bg:#0D1B20;--card:#142A31;--ink:#E6F2F3;--mut:#93AEB5;--line:#244048;--pri:#4FC1CF;--pri2:#8ADBE5;--mint:#173A35;--sky:#16313F;--sand:#3A2E1A;--redbg:#3A1A1A;--red:#FF8A8A}}
:root[data-theme="dark"]{--leaf:#1D3A24;--bg:#0D1B20;--card:#142A31;--ink:#E6F2F3;--mut:#93AEB5;--line:#244048;--pri:#4FC1CF;--pri2:#8ADBE5;--mint:#173A35;--sky:#16313F;--sand:#3A2E1A;--redbg:#3A1A1A;--red:#FF8A8A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0 0 .4em;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:.65em 1.1em;background:var(--pri);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}button.r{background:var(--red);color:#fff}button.s{padding:.4em .8em;font-size:.88rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
input,select{font:inherit;padding:.65em .8em;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}.sm{font-size:.88rem}
.chip{display:inline-block;background:var(--mint);color:var(--pri2);border-radius:99px;padding:.2em .75em;font-size:.85rem;margin:3px 4px 3px 0}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;min-height:calc(100vh - 40px)}
.hero h1{font-size:clamp(2.2rem,5vw,3.6rem)}.mock{background:linear-gradient(160deg,var(--sky),var(--mint));border-radius:28px;padding:22px}
.bub{padding:.6em .9em;border-radius:16px;margin:8px 0;max-width:88%;box-shadow:0 1px 0 var(--line)}.bub.b{background:var(--card)}.bub.u{background:var(--pri);color:#fff;margin-left:auto}
nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .in{display:flex;gap:4px;overflow-x:auto;align-items:center;max-width:1080px;margin:auto;padding:8px 12px}
nav button{background:transparent;color:var(--mut);white-space:nowrap;padding:.5em .85em}nav button.on{background:var(--mint);color:var(--pri2)}
.brand{font:700 1.1rem Fraunces,serif;color:var(--pri);margin-right:8px;white-space:nowrap}
.st{font-size:.8rem;border-radius:99px;padding:.2em .7em;margin-left:auto;white-space:nowrap}.live{background:var(--mint);color:var(--ok)}.off{background:var(--sand);color:#B56A00}
.dept{border-radius:22px;padding:22px;color:var(--ink);cursor:pointer;border:1px solid var(--line)}.dept .ic{font-size:2.4rem}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px}.msgs{flex:1;overflow:auto;padding:6px}
.slot{background:var(--sky);color:var(--ink);border:1.5px solid var(--line);margin:4px 4px 0 0;text-align:left}.slot:hover{border-color:var(--pri)}
.warn{background:var(--redbg);border:2px solid var(--red);border-radius:16px;padding:14px;margin:8px 0}
.prog{display:flex;gap:4px;font-size:.78rem;margin:8px 0}.prog span{flex:1;text-align:center;padding:.3em;border-radius:99px;background:var(--line);color:var(--mut)}.prog .d{background:var(--pri);color:#fff}
.ok{border:2px solid var(--ok);border-radius:18px;padding:14px;background:var(--mint)}
.inp{display:flex;gap:8px;padding-top:8px}.mic{width:48px;border-radius:50%;padding:0;height:48px}.mic.rec{background:var(--red);animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
table{width:100%;border-collapse:collapse}td,th{padding:.5em;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.bar{height:10px;border-radius:9px;background:var(--pri);margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:14px;z-index:99;display:none;max-width:90vw}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:0}.wrap{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=document.getElementById('app');
const LANGS=[['en','English','en-IN',"Hi! 👋 How can I help you today?"],['hi','हिन्दी','hi-IN',"नमस्ते! 👋 मैं आपकी कैसे मदद कर सकता हूँ?"],['kn','ಕನ್ನಡ','kn-IN',"ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಬಹುದು?"],['te','తెలుగు','te-IN',"నేను మీకు ఎలా సహాయం చేయగలను?"],['ta','தமிழ்','ta-IN',"நான் உங்களுக்கு எப்படி உதவ முடியும்?"],['ml','മലയാളം','ml-IN',"ഞാൻ നിങ്ങളെ എങ്ങനെ സഹായിക്കണം?"],['mr','मराठी','mr-IN',"मी तुम्हाला कशी मदत करू?"],['bn','বাংলা','bn-IN',"আমি আপনাকে কীভাবে সাহায্য করতে পারি?"],['gu','ગુજરાતી','gu-IN',"હું તમને કેવી રીતે મદદ કરી શકું?"],['pa','ਪੰਜਾਬੀ','pa-IN',"ਮੈਂ ਤੁਹਾਡੀ ਕਿਵੇਂ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ?"],['or','ଓଡ଼ିଆ','or-IN',"ମୁଁ ଆପଣଙ୍କୁ କିପରି ସାହାଯ୍ୟ କରିପାରିବି?"],['ur','اردو','ur-IN',"میں آپ کی کیسے مدد کر سکتا ہوں؟"]];
const T={en:{found:'I can help with that. Here are available appointments:',alt:'That time isn’t available. I found these alternatives:',none:'No suitable slot is currently available.',who:'Who is this appointment for?'},hi:{found:'मैं मदद कर सकता हूँ। उपलब्ध अपॉइंटमेंट:',alt:'वह समय उपलब्ध नहीं है। ये विकल्प हैं:',none:'अभी कोई उपयुक्त स्लॉट उपलब्ध नहीं है।',who:'यह अपॉइंटमेंट किसके लिए है?'},kn:{found:'ಸಹಾಯ ಮಾಡುತ್ತೇನೆ. ಲಭ್ಯವಿರುವ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್‌ಗಳು:',alt:'ಆ ಸಮಯ ಲಭ್ಯವಿಲ್ಲ. ಪರ್ಯಾಯಗಳು:',none:'ಸೂಕ್ತ ಸ್ಲಾಟ್ ಈಗ ಲಭ್ಯವಿಲ್ಲ.',who:'ಈ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಯಾರಿಗಾಗಿ?'}};
const DP={dental:{n:'Dental Care',ic:'😁',bg:'var(--sky)',d:'Dental consultations, cleaning, tooth pain, gums, braces, root canal, implants and other dental services.',sv:['Dental Check-up','Teeth Cleaning','Tooth Pain','Gum Problems','Cavities','Root Canal','Braces / Orthodontics','Dental Implants','Wisdom Tooth','Cosmetic Dentistry','Emergency Dental Care']},general:{n:'General Healthcare',ic:'🏥',bg:'var(--mint)',d:'Consult doctors for common illnesses, chronic conditions, general health concerns and medical check-ups.',sv:['Fever','Cold','Cough','Headache','Body Pain','Stomach Problems','Allergy','Skin Problems','Blood Pressure','Blood Sugar / Diabetes','Thyroid','Cholesterol','Asthma','General Check-up','Women’s Health','Men’s Health','Child Health','Elderly Care','Preventive Check-up','Follow-up Consultation','General Physician']},physio:{n:'Physiotherapy & Rehabilitation',ic:'💪',bg:'var(--sand)',d:'Personalized physiotherapy and rehabilitation support for pain, mobility, recovery and physical wellness.',sv:['Back Pain','Neck Pain','Knee Pain','Shoulder Pain','Joint Pain','Sports Injury','Post-Surgery Rehab','Post-Fracture Rehab','Muscle Recovery','Posture Problems','Mobility Training','Balance Training','Elderly Physiotherapy','Stroke Rehabilitation','General Physiotherapy']},ayur:{n:'Ayurveda',ic:'🌿',bg:'var(--leaf)',d:'Panchakarma, digestion, stress, sleep, joint and skin care through traditional Ayurvedic consultation.',sv:['Panchakarma','Digestion Problems','Stress','Sleep Problems','Joint Care','Skin Care','Ayurvedic Consultation']}};
const D=[];const mk=(dp,a)=>a.forEach(x=>D.push({id:D.length,dp,n:x[0],ph:x[1],sp:x[2],ex:x[3],fee:x[4],k:x[5]}));
mk('dental',[['Dr. Saraswati Donur','8147969656','Dentist · Endodontics','14 yrs',500,'saraswati donur'],['Dr. Arjun Mehta','9000012345','Orthodontist','11 yrs',500,'arjun mehta'],['Dr. Priya Sharma','9000012346','Cosmetic Dentist','9 yrs',500,'priya sharma'],['Dr. Rahul Desai','9000012347','Oral Surgeon','12 yrs',500,'rahul desai']]);
mk('general',[['Dr. Shubhangi Desai','7676923453','General Physician','15 yrs',500,'shubhangi'],['Dr. Vikram Rao','9000023451','Internal Medicine','18 yrs',500,'rao'],['Dr. Ananya Iyer','9000023452','Family Medicine','8 yrs',500,'ananya'],['Dr. Rohan Kulkarni','9000023453','Child & Adult Care','10 yrs',500,'rohan']]);
mk('physio',[['Dr. Tasbiya Burli','7353209373','Musculoskeletal Physio','9 yrs',500,'tasbiya'],['Dr. Neha Patil','9000034561','Sports Rehabilitation','7 yrs',500,'neha'],['Dr. Karan Shah','9000034562','Neuro Rehabilitation','12 yrs',500,'karan'],['Dr. Meera Nair','9000034563','Geriatric Physio','10 yrs',500,'meera']]);
mk('ayur',[['Dr. Kavya Menon','9000045671','Ayurvedic Physician','10 yrs',500,'kavya'],['Dr. Sanjay Joshi','9000045672','Panchakarma Specialist','12 yrs',500,'sanjay'],['Dr. Lakshmi Pillai','9000045673','Ayurvedic Dermatology','8 yrs',500,'lakshmi'],['Dr. Arvind Rao','9000045674','Ayurvedic Medicine','15 yrs',500,'arvind']]);
const HOSP=['Smile Craft Dental Hospital','Smile Craft Dental Hospital','PearlWhite Dental & Implant Centre','PearlWhite Dental & Implant Centre','Sanjeevani Multispeciality Hospital','Sanjeevani Multispeciality Hospital','CarePoint Family Hospital','CarePoint Family Hospital','MoveWell Physio & Rehab Centre','MoveWell Physio & Rehab Centre','Kinetic Rehab & Sports Clinic','Kinetic Rehab & Sports Clinic','Ayushya Ayurveda Hospital','Ayushya Ayurveda Hospital','Vedic Wellness Panchakarma Centre','Vedic Wellness Panchakarma Centre'];D.forEach((d,i)=>d.h=HOSP[i]);
const TIMES=['09:00','10:30','11:30','14:00','16:30','18:00'],DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=k=>{const d=new Date();d.setDate(d.getDate()+k);return d};
const fd=s=>new Date(s+'T12:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const ft=t=>{let h=+t.slice(0,2);return pad(h%12||12)+':'+t.slice(3)+(h<12?' AM':' PM')};
let S=load();function load(){try{return JSON.parse(localStorage.getItem('hc'))||null}catch(e){return null}}
function save(){try{localStorage.setItem('hc',JSON.stringify(S))}catch(e){}}
function fresh(){return{user:null,lang:'en',appts:[],wait:[],freed:[],fam:[],prefs:{},cancelled:0}}
S=S||fresh();let HS=null,V='landing',DEPT='general',MSG=[],FLOW=null,REG=[],OTP=null,ONLINE=navigator.onLine,voice=false,reg={},idle;
const L=()=>LANGS.find(l=>l[0]==S.lang)||LANGS[0],t=k=>(T[S.lang]||T.en)[k]||T.en[k];
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
function slots(doc,from=0,n=7){const r=[];for(let k=from;k<from+n;k++){const di=iso(addD(k));TIMES.forEach((tm,j)=>{let st=(doc.id*5+k*3+j)%4==0?'Booked':'Available';const key=doc.id+'|'+di+'|'+tm;if(S.freed.includes(key))st='Available';if(k==0&&+tm.slice(0,2)<=new Date().getHours())st='Past';if(S.appts.some(a=>a.doc==doc.id&&a.date==di&&a.t==tm&&a.st=='Confirmed'))st='Booked';if(st!='Past')r.push({doc:doc.id,date:di,t:tm,st,k})})}return r}
function seed(){S.appts=[{id:1,doc:4,date:iso(addD((6-new Date().getDay()+7)%7||7)),t:'10:30',st:'Confirmed',who:'Self',type:'Consultation',paid:500},{id:2,doc:0,date:iso(addD(-40)),t:'11:30',st:'Completed',who:'Self',type:'Check-up',paid:500},{id:3,doc:6?6:6,date:iso(addD(-90)),t:'09:00',st:'Completed',who:'Self',type:'Consultation',paid:500}];S.prefs={doc:4,time:'Morning',dept:'general'}}
function go(v,d){V=v;if(d){DEPT=d;HS=null}render();scrollTo(0,0)}
function bump(){clearTimeout(idle);idle=setTimeout(()=>{if(S.user){logout();toast('Signed out after 15 minutes of inactivity')}},9e5)}
addEventListener('click',bump);
addEventListener('online',()=>{ONLINE=true;toast('Back Online — queued demo actions synced');render()});addEventListener('offline',()=>{ONLINE=false;render()});
function logout(){S.user=null;save();MSG=[];FLOW=null;go('landing')}
function nav(){const it=[['home','Home'],['dental','Dental'],['general','General Healthcare'],['physio','Physiotherapy'],['ayur','Ayurveda'],['chat','AI Assistant'],['appts','Appointments'],['profile','Profile'],['admin','Admin']];
return`<nav><div class="in"><span class="brand">✚ MediGuide AI</span>${it.map(x=>`<button class="${V==x[0]?'on':''}" onclick="${['dental','general','physio','ayur'].includes(x[0])?`go('dept','${x[0]}')`:`go('${x[0]}')`}">${x[1]}</button>`).join('')}<span class="st ${ONLINE?'live':'off'}">${ONLINE?'🟢 Live Mode':'🟠 Offline Demo Mode'}</span></div></nav>`}
function render(){bump();let h='';
if(V=='landing')h=landing();else if(V=='lang')h=langPick();else{h=nav()+'<div class="wrap">'+({home,dept:deptV,chat:chatV,appts:apptsV,profile:profileV,admin:adminV})[V]()+'</div>'}
E.innerHTML=h;if(V=='chat'){const m=$('.msgs');m.scrollTop=m.scrollHeight}}
function landing(){const r=reg.step;return`<div class="wrap hero"><div><span class="chip">Dental · General · Physiotherapy · Ayurveda</span><h1>MediGuide AI</h1><p style="font-size:1.2rem" class="mut">Your intelligent healthcare assistant — from symptoms to appointment.</p>
<div class="card" style="max-width:440px">${!r?`<div class="row"><button onclick="reg={step:'login'};render()">Login</button><button class="g" onclick="reg={step:'mobile'};render()">Register</button><button class="g" onclick="demo()">Continue as Demo Patient</button></div><p class="sm mut">Registration is always free. We collect only the information required for your appointment.</p>`
:r=='login'||r=='mobile'?`<h3>${r=='login'?'Login':'Register'}</h3><label class="sm">Mobile number</label><input id="mob" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="${reg.mob||''}"><div class="row" style="margin-top:10px"><button onclick="sendOtp()">Send OTP</button><button class="g" onclick="reg={};render()">Back</button></div>`
:r=='otp'?`<h3>Verify mobile</h3><p class="chip">Demo OTP: ${OTP} (no real SMS is sent)</p><input id="otp" inputmode="numeric" maxlength="4" placeholder="Enter 4-digit OTP"><div class="row" style="margin-top:10px"><button onclick="verOtp()">Verify</button><button class="g" onclick="reg={};render()">Cancel</button></div>`
:`<h3>Your details</h3><input id="nm" placeholder="Full name" style="margin-bottom:8px"><input id="em" placeholder="Email (optional)" type="email">`+`<div class="row" style="margin-top:10px"><button onclick="finishReg()">Create free account</button></div>`}</div></div>
<div class="mock"><div class="bub b">I have been having knee pain for two weeks. Saturday morning works.</div><div class="bub b">A physiotherapy consultation may be appropriate. Dr. Karan Shah has 10:30 AM free.</div><div class="card"><b>Dr. Karan Shah</b><div class="mut sm">Saturday · 10:30 AM · ₹700</div><div class="prog"><span class="d">Understand</span><span class="d">Slot</span><span>Verify</span><span>Details</span><span>Confirm</span></div></div></div></div>`}
function demo(){seed();S.user={name:'Demo Patient',mob:'9876543210',verified:true,demo:true};save();go('lang')}
function sendOtp(){const m=$('#mob').value.trim();if(!/^\d{10}$/.test(m))return toast('Enter a valid 10-digit mobile number');reg.mob=m;OTP=String(1000+Math.floor(Math.random()*9000));reg.step='otp';render()}
function verOtp(){if($('#otp').value==OTP){if(reg.step&&S.appts.length==0&&false){}reg.step='det';render()}else toast('Incorrect OTP')}
function finishReg(){const n=$('#nm').value.trim();if(!n)return toast('Please enter your name');S.user={name:n,mob:reg.mob,email:$('#em').value,verified:true};save();reg={};go('lang')}
function langPick(){return`<div class="wrap" style="max-width:720px;padding-top:8vh"><h1>Choose your language</h1><p class="mut">You can change it anytime in the chat.</p><div class="grid g3">${LANGS.map(l=>`<button class="g" style="padding:1em;font-size:1.1rem" onclick="setLang('${l[0]}')">${l[1]}</button>`).join('')}</div></div>`}
function setLang(c){S.lang=c;save();MSG=[];FLOW=null;go(V=='lang'?'home':V)}
function home(){return`<h1>Welcome${S.user?', '+S.user.name.split(' ')[0]:''}</h1><p class="mut">Pick a care area, or just tell the assistant what you need.</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${Object.entries(DP).map(([k,d])=>`<div class="dept" style="background:${d.bg}" onclick="go('dept','${k}')" tabindex="0" role="button"><div class="ic">${d.ic}</div><h2>${d.n}</h2><p>${d.d}</p><span class="chip">${D.filter(x=>x.dp==k).length} doctors</span></div>`).join('')}</div>
<div class="card" style="margin-top:14px;background:var(--mint)"><div class="row"><div style="flex:1"><h3>Not sure where to start?</h3><span class="mut">Describe it in your own words — type or speak.</span></div><button onclick="go('chat')">Open AI Assistant</button></div></div>`}
function rating(d){const r=(S.reviews||[]).filter(x=>x.doc==d.id);const b=4.3+(d.id*7%6)/10,n0=20+d.id*6;return{avg:((b*n0+r.reduce((a,x)=>a+x.stars,0))/(n0+r.length)).toFixed(1),n:n0+r.length}}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function showRev(id){const e=$('#rv'+id);if(e.innerHTML){e.innerHTML='';return}const mine=(S.reviews||[]).filter(x=>x.doc==id).map(x=>`<div class="sm"><b>${stars(x.stars)}</b> ${x.text||''} <span class="mut">— ${x.name}</span></div>`).join('');e.innerHTML='<div style="margin-top:8px">'+mine+'<div class="sm"><b>★★★★★</b> Listened carefully and explained everything clearly. <span class="mut">— Patient</span></div><div class="sm"><b>★★★★☆</b> Easy booking, short waiting time. <span class="mut">— Patient</span></div></div>'}
function rvForm(id){const e=$('#rf'+id);e.innerHTML=`<div style="margin-top:8px"><label class="sm">Your rating</label><select id="rs${id}"><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Good</option><option value="3">★★★☆☆ Okay</option><option value="2">★★☆☆☆ Poor</option><option value="1">★☆☆☆☆ Very poor</option></select><input id="rt${id}" maxlength="200" placeholder="Short comment (optional) — please don’t include medical details" style="margin:6px 0"><button class="s" onclick="saveRev(${id})">Submit review</button></div>`}

const dc=D.filter(d=>x.includes(d.k)).sort((a,b)=>b.k.length-a.k.length)[0];if(dc){o.doc=dc.id;o.dp=dc.dp}

const m=x.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/)||x.match(/\bat (\d{1,2})(?::(\d{2}))?()/)||x.match(/(\d{1,2}):(\d{2})()/);if(m){let h=+m[1];if(m[3]=='pm'&&h<12)h+=12;if(!m[3]&&h<8)h+=12;o.tm=pad(h)+':'+(m[2]||'00')}
